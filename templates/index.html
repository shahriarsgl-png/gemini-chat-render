<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>AI Chat Assistant</h1>
      <p class="student-info">{{ name }} &nbsp;|&nbsp; Student ID: {{ student_id }}</p>
    </header>

    <main class="chat-container">
      <div id="chat-log" class="chat-log">
        <div class="message bot">
          Hi! I'm a simple AI chatbot powered by Google Gemini. Ask me anything.
        </div>
      </div>

      <form id="chat-form" class="chat-form">
        <input
          type="text"
          id="user-input"
          placeholder="Type your message..."
          autocomplete="off"
          required
        />
        <button type="submit">Send</button>
      </form>
    </main>

    <footer class="footer">
      <p>Simple Render-based cloud service &middot; AI feature via Google Gemini API</p>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
